<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Игры 1×1 — Уно и Шашки</title>
<style>
:root{
  --primary:#6750A4; --on-primary:#fff;
  --primary-container:#EADDFF; --on-primary-container:#21005D;
  --secondary-container:#E8DEF8; --on-secondary-container:#1D192B;
  --tertiary-container:#FFD8E4; --on-tertiary-container:#31111D;
  --surface:#FEF7FF; --surface-c:#F3EDF7; --surface-ch:#ECE6F0;
  --on-surface:#1D1B20; --on-surface-v:#49454F;
  --outline:#79747E; --outline-v:#CAC4D0;
  --error:#B3261E; --error-c:#F9DEDC;
  --shadow:rgba(0,0,0,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--surface);color:var(--on-surface);min-height:100dvh;
  overscroll-behavior:none;
}
.screen{max-width:560px;margin:0 auto;padding:20px 16px 40px;min-height:100dvh;display:flex;flex-direction:column;gap:16px}
.hidden{display:none!important}
h1{font-size:30px;font-weight:500;margin:8px 0 4px;letter-spacing:-.4px}
h2{font-size:20px;font-weight:500;margin:0}
.sub{color:var(--on-surface-v);font-size:14px;margin:0 0 8px}

.card{
  background:var(--surface-c);border-radius:24px;padding:18px;
  display:flex;flex-direction:column;gap:12px;
}
.card.elev{background:var(--surface-ch);box-shadow:0 1px 3px var(--shadow)}

input{
  font:inherit;font-size:16px;padding:14px 16px;border-radius:16px;
  border:1px solid var(--outline-v);background:var(--surface);
  color:var(--on-surface);outline:none;width:100%;transition:.18s;
}
input:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-container)}

button{
  font:inherit;font-weight:500;font-size:15px;letter-spacing:.1px;
  padding:14px 20px;border-radius:999px;border:none;cursor:pointer;
  background:var(--primary);color:var(--on-primary);transition:.18s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
button:active{transform:scale(.97)}
button:disabled{opacity:.38;cursor:not-allowed}
button.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
button.outline{background:transparent;color:var(--primary);border:1px solid var(--outline)}
button.small{padding:9px 16px;font-size:13px}
button.ghost{background:transparent;color:var(--on-surface-v);padding:9px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  background:var(--tertiary-container);color:var(--on-tertiary-container);
  font-size:15px;font-weight:600;letter-spacing:2px;cursor:pointer;user-select:none;
}
.chip:active{opacity:.7}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-size:12px;color:var(--on-surface-v);text-transform:uppercase;letter-spacing:.6px}

/* ===== UNO ===== */
.table{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.opp-hand{
  display:flex;justify-content:center;align-items:center;gap:0;
  padding:6px 0;min-height:56px;overflow-x:auto;scrollbar-width:none;
}
.opp-hand::-webkit-scrollbar{display:none}
.cardback{
  width:30px;height:46px;border-radius:8px;
  background:linear-gradient(135deg,#4a3f63,#2f2743);
  box-shadow:0 2px 4px var(--shadow);flex:none;
}
.cardback.sm{width:26px;height:40px;border-radius:6px;margin-left:-14px}
.cardback.sm:first-child{margin-left:0}
.center-pile{display:flex;justify-content:center;align-items:center;gap:24px;padding:14px 0}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px}
.pile .label{font-size:11px;color:var(--on-surface-v);text-transform:uppercase;letter-spacing:.6px}
.uno-card{
  width:76px;height:114px;border-radius:14px;position:relative;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;box-shadow:0 3px 8px var(--shadow);
  user-select:none;overflow:hidden;
}
.uno-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:rgba(255,255,255,.18);clip-path:ellipse(70% 45% at 50% 50%);
  transform:rotate(-35deg);pointer-events:none;
}
.uno-card .mid{font-size:40px;line-height:1;position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.uno-card .tl,.uno-card .br{position:absolute;font-size:15px;line-height:1;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.uno-card .tl{top:8px;left:9px}
.uno-card .br{bottom:8px;right:9px;transform:rotate(180deg)}
.uno-card.red{background:#C5504A}
.uno-card.yellow{background:#D9A400}
.uno-card.green{background:#4E8C6A}
.uno-card.blue{background:#4A7BB5}
.uno-card.wild{background:#5C5470}
.uno-card.wild::after{
  content:'';position:absolute;width:44px;height:44px;border-radius:50%;
  background:conic-gradient(#C5504A 0 25%,#D9A400 0 50%,#4E8C6A 0 75%,#4A7BB5 0);
  z-index:0;
}
.uno-card.wild .mid{color:#fff;font-size:22px}
.hand{
  display:flex;gap:8px;overflow-x:auto;padding:12px 4px 18px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:flex-end;
}
.hand::-webkit-scrollbar{display:none}
.hand .uno-card{width:66px;height:100px;cursor:pointer;transition:transform .15s}
.hand .uno-card.playable{outline:3px solid var(--primary);outline-offset:2px}
.hand .uno-card.playable:active{transform:translateY(-14px)}
.hand .uno-card.dim{opacity:.55;filter:grayscale(.5)}
.hand .uno-card .mid{font-size:34px}
.color-dot{
  position:absolute;top:6px;right:6px;width:14px;height:14px;border-radius:50%;
  border:2px solid #fff;z-index:2;
}
.banner{
  padding:12px 16px;border-radius:18px;font-size:14px;text-align:center;
  background:var(--secondary-container);color:var(--on-secondary-container);
}
.banner.warn{background:var(--error-c);color:var(--error)}
.color-picker{
  position:fixed;inset:0;background:rgba(29,27,32,.5);display:flex;
  align-items:center;justify-content:center;z-index:50;padding:20px;
}
.color-picker .box{
  background:var(--surface);border-radius:28px;padding:24px;display:flex;
  flex-direction:column;gap:16px;align-items:center;
}
.color-picker .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.color-picker .sw{
  width:78px;height:78px;border-radius:22px;cursor:pointer;border:none;
  box-shadow:0 2px 6px var(--shadow);
}
.color-picker .sw:active{transform:scale(.94)}

/* ===== CHECKERS ===== */
.board-wrap{display:flex;justify-content:center;padding:6px 0}
.board{
  display:grid;grid-template-columns:repeat(8,1fr);
  width:min(94vw,440px);aspect-ratio:1;border-radius:20px;overflow:hidden;
  box-shadow:0 4px 14px var(--shadow);
}
.sq{
  position:relative;display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;
}
.sq.light{background:#EFE9F2}
.sq.dark{background:#6E5D80}
.sq .pc{
  width:78%;height:78%;border-radius:50%;position:relative;
  box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .12s;
}
.sq .pc.w{background:radial-gradient(circle at 35% 30%,#fff,#DCD3E4);border:2px solid #B9AEC4}
.sq .pc.b{background:radial-gradient(circle at 35% 30%,#5A4A66,#2A2130);border:2px solid #1A1420}
.sq .pc.king::after{
  content:'★';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#D9A400;text-shadow:0 1px 2px rgba(0,0,0,.4);
}
.sq .pc.b.king::after{color:#E8C766}
.sq.sel .pc{transform:scale(1.08);box-shadow:0 0 0 3px var(--primary),0 3px 8px rgba(0,0,0,.35)}
.sq.chain .pc{box-shadow:0 0 0 3px #D9A400,0 3px 8px rgba(0,0,0,.35)}
.sq.target::before{
  content:'';position:absolute;width:32%;height:32%;border-radius:50%;
  background:rgba(103,80,164,.55);
}
.sq.target.cap::before{background:rgba(179,38,30,.6);width:44%;height:44%}
.sq.lastmove{box-shadow:inset 0 0 0 3px rgba(217,164,0,.6)}

.status{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:12px 16px;border-radius:18px;background:var(--surface-c);
  font-size:14px;
}
.status .you{color:var(--primary);font-weight:600}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:#322F35;color:#F5EFF7;padding:12px 20px;border-radius:14px;
  font-size:14px;z-index:100;box-shadow:0 4px 12px var(--shadow);
  animation:pop .25s ease;max-width:90vw;text-align:center;
}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.waiting{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 20px;text-align:center}
.spinner{
  width:44px;height:44px;border-radius:50%;
  border:4px solid var(--primary-container);border-top-color:var(--primary);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============== ЛОББИ ============== -->
<section id="lobby" class="screen">
  <div>
    <h1>Игры 1×1</h1>
    <p class="sub">Уно и шашки — играйте с другом по коду комнаты</p>
  </div>

  <div class="card">
    <div class="tag">Ваше имя</div>
    <input id="nameInput" placeholder="Например, Саша" maxlength="16"/>
  </div>

  <div class="card elev">
    <h2>Создать комнату</h2>
    <div class="row">
      <button data-create="uno">🃏 Уно</button>
      <button data-create="checkers" class="tonal">⚫ Шашки</button>
    </div>
  </div>

  <div class="card elev">
    <h2>Присоединиться</h2>
    <input id="codeInput" placeholder="Код комнаты (4 символа)" maxlength="4" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-weight:600"/>
    <button id="joinBtn" class="outline">Войти в комнату</button>
  </div>
</section>

<!-- ============== КОМНАТА ============== -->
<section id="room" class="screen hidden">
  <div class="topbar">
    <div>
      <div class="tag" id="gameLabel">Комната</div>
      <h2 id="gameTitle">Ожидание…</h2>
    </div>
    <div class="row" style="flex:0 0 auto;gap:6px">
      <div class="chip" id="roomChip">----</div>
      <button class="ghost small" id="leaveBtn">Выйти</button>
    </div>
  </div>

  <div id="waiting" class="waiting">
    <div class="spinner"></div>
    <div>Ждём второго игрока…</div>
    <div class="sub">Отправьте другу код комнаты</div>
  </div>

  <div id="gameArea" class="hidden" style="flex:1;display:flex;flex-direction:column;gap:12px;min-height:0">
    <div id="status" class="status"></div>
    <div id="boardArea"></div>
    <div id="handArea"></div>
    <div id="actionArea" class="row"></div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
/* ============================================================
   FIREBASE CONFIG
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCGiD0Yte1ZhGDb5BlVYYU40fE3p8Y1aI0",
  authDomain: "mymis-9893a.firebaseapp.com",
  databaseURL: "https://mymis-9893a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mymis-9893a",
  storageBucket: "mymis-9893a.firebasestorage.app",
  messagingSenderId: "107930137475",
  appId: "1:107930137475:web:9f7dcbaea42d44c4083cb6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================================
   Утилиты
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}
function shuffle(a){
  const r = [...a];
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
}
const clone = o => JSON.parse(JSON.stringify(o));

let myId = localStorage.getItem('pid');
if(!myId){ myId = 'p_'+Math.random().toString(36).slice(2,10); localStorage.setItem('pid', myId); }
let myName = localStorage.getItem('pname') || '';
if(myName) $('#nameInput').value = myName;

/* ============================================================
   Состояние клиента
   ============================================================ */
let roomId = null;
let mySeat = null;
let roomRef = null;
let room = null;
let sel = null;                 // выделенная шашка [r,c]
let lastMove = null;            // {from,to} для подсветки
let initingState = false;       // защита от повторной инициализации

/* ============================================================
   ЛОББИ
   ============================================================ */
$$('[data-create]').forEach(btn => {
  btn.onclick = () => {
    const name = $('#nameInput').value.trim();
    if(!name){ toast('Введите имя'); return; }
    myName = name; localStorage.setItem('pname', name);
    createRoom(btn.dataset.create);
  };
});

$('#joinBtn').onclick = () => {
  const name = $('#nameInput').value.trim();
  const code = $('#codeInput').value.trim().toUpperCase();
  if(!name){ toast('Введите имя'); return; }
  if(code.length < 4){ toast('Код из 4 символов'); return; }
  myName = name; localStorage.setItem('pname', name);
  joinRoom(code);
};

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

async function createRoom(game){
  let code;
  for(let i=0;i<10;i++){
    code = genCode();
    const snap = await db.ref('rooms/'+code).get();
    if(!snap.exists()) break;
    code = null;
  }
  if(!code){ toast('Ошибка, попробуйте снова'); return; }

  await db.ref('rooms/'+code).set({
    game,
    status: 'waiting',
    createdAt: Date.now(),
    players: { p0: { uid: myId, name: myName } }
  });
  enterRoom(code, 'p0');
}

async function joinRoom(code){
  const ref = db.ref('rooms/'+code);
  const snap = await ref.get();
  if(!snap.exists()){ toast('Комната не найдена'); return; }
  const data = snap.val();
  if(!data.players || !data.players.p0){ toast('Комната пустая'); return; }
  if(data.players.p0.uid === myId){ enterRoom(code,'p0'); return; }
  if(data.players.p1 && data.players.p1.uid !== myId){ toast('Комната занята'); return; }

  await ref.child('players/p1').set({ uid: myId, name: myName });
  await ref.child('status').set('playing');
  enterRoom(code, 'p1');
}

function enterRoom(code, seat){
  roomId = code;
  mySeat = seat;
  roomRef = db.ref('rooms/'+code);
  initingState = false;
  $('#lobby').classList.add('hidden');
  $('#room').classList.remove('hidden');
  $('#roomChip').textContent = code;

  roomRef.on('value', snap => {
    if(!snap.exists()){ toast('Комната закрыта'); leaveRoom(); return; }
    room = snap.val();
    render();
  });
}

function leaveRoom(){
  if(roomRef) roomRef.off();
  roomId = null; mySeat = null; room = null; roomRef = null;
  sel = null; lastMove = null; initingState = false;
  $('#room').classList.add('hidden');
  $('#lobby').classList.remove('hidden');
  $('#waiting').classList.remove('hidden');
  $('#gameArea').classList.add('hidden');
  $('#boardArea').innerHTML = '';
  $('#handArea').innerHTML = '';
  $('#actionArea').innerHTML = '';
}
$('#leaveBtn').onclick = leaveRoom;

$('#roomChip').onclick = () => {
  navigator.clipboard?.writeText(roomId);
  toast('Код скопирован: ' + roomId);
};

/* ============================================================
   РЕНДЕР
   ============================================================ */
function render(){
  if(!room) return;

  $('#gameTitle').textContent = room.game === 'uno' ? 'Уно' : 'Шашки';
  $('#gameLabel').textContent = room.players?.p1 ? 'Игра идёт' : 'Ожидание игрока';

  const ready = !!(room.players && room.players.p0 && room.players.p1);
  const hasState = !!room.state;

  if(!ready){
    $('#waiting').classList.remove('hidden');
    $('#gameArea').classList.add('hidden');
    return;
  }

  if(!hasState){
    if(mySeat === 'p0' && !initingState){
      initingState = true;
      initGameState(room.game);
    }
    $('#waiting').classList.remove('hidden');
    $('#gameArea').classList.add('hidden');
    return;
  }
  initingState = false;

  $('#waiting').classList.add('hidden');
  $('#gameArea').classList.remove('hidden');

  if(room.game === 'uno') renderUno();
  else renderCheckers();
}

/* ============================================================
   ТРАНЗАКЦИЯ СОСТОЯНИЯ (атомарная, безопасная при гонках)
   ============================================================ */
async function updateState(mutator){
  const ref = roomRef.child('state');
  const res = await ref.transaction(cur => {
    if(!cur) return;                     // нет состояния — отменяем
    const next = mutator(clone(cur));
    if(next === undefined) return;       // отмена (правило вернуло undefined)
    return next;
  });
  return res.committed;
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ ЧЕРЕЗ TRANSACTION — чтобы только один клиент записал
   ============================================================ */
function initGameState(game){
  const ref = roomRef.child('state');
  ref.transaction(cur => {
    if(cur) return;                      // уже инициализировано — отмена
    return game === 'uno' ? makeUnoState() : makeCheckersState();
  }).then(() => { initingState = false; });
}

/* ============================================================
   УНО
   ============================================================ */
function buildUnoDeck(){
  const colors = ['red','yellow','green','blue'];
  const deck = [];
  let id = 0;
  for(const c of colors){
    deck.push({id:id++, color:c, value:'0'});
    for(let n=1;n<=9;n++){
      deck.push({id:id++, color:c, value:String(n)});
      deck.push({id:id++, color:c, value:String(n)});
    }
    for(const v of ['skip','reverse','draw2']){
      deck.push({id:id++, color:c, value:v});
      deck.push({id:id++, color:c, value:v});
    }
  }
  for(let i=0;i<4;i++){
    deck.push({id:id++, color:'wild', value:'wild'});
    deck.push({id:id++, color:'wild', value:'draw4'});
  }
  return deck;
}

function makeUnoState(){
  let deck = shuffle(buildUnoDeck());
  const h0 = deck.splice(0,7);
  const h1 = deck.splice(0,7);
  let first = deck.pop();
  while(first.color === 'wild'){ deck.unshift(first); first = deck.pop(); }
  return {
    deck,
    discard: [first],
    hands: { p0: h0, p1: h1 },
    currentColor: first.color,
    turn: 'p0',
    hasDrawn: false,
    drawnCardId: null,
    winner: null,
    log: 'Игра началась! Ходит ' + nameOf('p0')
  };
}

function canPlayUno(card, top, currentColor){
  if(!card || !top) return false;
  if(card.color === 'wild') return true;
  if(card.color === currentColor) return true;
  if(top.color !== 'wild' && card.value === top.value) return true;
  return false;
}

const unoLabel = v => ({
  'skip':'⊘','reverse':'⇄','draw2':'+2','wild':'★','draw4':'+4'
}[v] || v);

function unoEffectText(card, seat, opp){
  const me = nameOf(seat), op = nameOf(opp);
  switch(card.value){
    case 'skip':    return `${me} сыграл ⊘ — ${op} пропускает ход`;
    case 'reverse': return `${me} сыграл ⇄ — ${op} пропускает ход`;
    case 'draw2':   return `${me} сыграл +2 — ${op} берёт 2 карты и пропускает`;
    case 'draw4':   return `${me} сыграл +4 — ${op} берёт 4 карты и пропускает`;
    default:        return `${me} сыграл ${unoLabel(card.value)}`;
  }
}

/* Сыграть карту */
function playUnoCard(cardId, chosenColor){
  updateState(s => {
    if(s.winner) return;
    if(s.turn !== mySeat) return;
    const hand = s.hands[mySeat];
    if(!hand) return;
    const idx = hand.findIndex(c => c.id === cardId);
    if(idx < 0) return;
    const card = hand[idx];
    const top = s.discard[s.discard.length-1];
    if(!canPlayUno(card, top, s.currentColor)) return;
    if(s.hasDrawn && s.drawnCardId !== cardId) return;

    hand.splice(idx,1);
    s.discard.push(card);
    s.hasDrawn = false; s.drawnCardId = null;

    const opp = mySeat === 'p0' ? 'p1' : 'p0';

    const ensureDeck = () => {
      if(s.deck.length > 0) return;
      if(s.discard.length <= 1) return;
      const t = s.discard.pop();
      s.deck = shuffle(s.discard);
      s.discard = [t];
    };
    const drawN = n => {
      for(let i=0;i<n;i++){
        ensureDeck();
        if(s.deck.length === 0) break;
        s.hands[opp].push(s.deck.pop());
      }
    };

    if(card.color === 'wild'){
      s.currentColor = chosenColor || 'red';
    } else {
      s.currentColor = card.color;
    }

    let again = false;
    if(card.value === 'skip' || card.value === 'reverse'){
      again = true;
    } else if(card.value === 'draw2'){
      drawN(2); again = true;
    } else if(card.value === 'draw4'){
      drawN(4); again = true;
    }
    s.log = unoEffectText(card, mySeat, opp);

    if(s.hands[mySeat].length === 0){
      s.winner = mySeat;
      s.log = `${nameOf(mySeat)} победил! 🎉`;
      return s;
    }

    s.turn = again ? mySeat : opp;
    return s;
  });
}
